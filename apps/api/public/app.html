<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d3e">
  <title>Sevari inbox</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app/app.css">
</head>
<body>
  <header class="top">
    <h1>Sevari</h1>
    <button id="refresh" class="ghost" type="button" hidden>Refresh</button>
  </header>
  <main id="main" tabindex="-1">
    <p id="status" role="status" aria-live="polite" class="status"></p>
    <section id="signin" class="card" hidden>
      <h2>Sign in</h2>
      <p>Paste the sign-in key from your welcome message. It stays on this device only until you close the app.</p>
      <form id="signin-form">
        <label for="token">Sign-in key</label>
        <input id="token" name="token" autocomplete="off" spellcheck="false" required>
        <button type="submit">Sign in</button>
      </form>
    </section>
    <section id="inbox" hidden>
      <h2 id="waiting-heading">Waiting for you</h2>
      <p id="empty" class="muted" hidden>Nothing needs you right now. Every customer has been acknowledged.</p>
      <ol id="questions" class="list" aria-labelledby="waiting-heading"></ol>
      <h2 id="updates-heading">Updates</h2>
      <ol id="notes" class="list notes" aria-labelledby="updates-heading"></ol>
    </section>
  </main>
  <template id="question-tpl">
    <li class="card question">
      <h3 class="q-title"></h3>
      <p class="q-summary"></p>
      <blockquote class="q-preview"></blockquote>
      <details class="q-facts"><summary>Facts it used</summary><ul></ul></details>
      <p class="q-default muted"></p>
      <div class="q-actions"></div>
      <form class="q-edit" hidden>
        <label>Your version</label>
        <textarea rows="8"></textarea>
        <div class="row"><button type="submit">Send my version</button><button type="button" class="ghost cancel">Cancel</button></div>
      </form>
    </li>
  </template>
  <script src="/app/app.js" type="module"></script>
</body>
</html>
